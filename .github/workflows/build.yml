name: Build Check

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build rapoo-tray.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          zig rc /c 65001 /I res /fo bin/app.o res/app.rc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig c++ -O3 -s -std=c++17 -municode '-Wl,--subsystem,windows' -static -Isrc `
            src/main.cpp `
            src/rapoo_protocol.cpp `
            src/device_manager.cpp `
            src/osd_window.cpp `
            src/tray_menu.cpp `
            src/alert_window.cpp `
            src/profile_manager.cpp `
            src/battery_estimator.cpp `
            src/settings_window.cpp `
            src/dpi_window.cpp `
            bin/app.o `
            -lsetupapi -lhid -luser32 -lgdi32 -lshell32 -ladvapi32 `
            -luxtheme -ldwmapi -lcomdlg32 -lcomctl32 `
            -o bin/rapoo-tray.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item bin/app.o -Force

      - name: Build rapoo-tray-setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          zig rc /c 65001 /fo installer/installer.o installer/installer.rc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig c++ -O3 -s -std=c++17 -municode '-Wl,--subsystem,windows' -static installer/installer.cpp installer/installer.o -lole32 -lshell32 -luser32 -lgdi32 -ladvapi32 -luuid -o dist/rapoo-tray-setup.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item installer/installer.o -Force

      - name: Build rapoo-plugin.dll
        shell: pwsh
        run: |
          zig rc /c 65001 /fo plugin/plugin.o plugin/plugin.rc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig c++ -shared -O3 -s -std=c++17 -municode -static plugin/rapoo_plugin.cpp plugin/plugin.o -lsetupapi -lhid -luser32 -lgdi32 -lshell32 -ladvapi32 -o bin/rapoo-plugin.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item plugin/plugin.o -Force

      - name: Upload build bundle
        uses: actions/upload-artifact@v4
        with:
          name: rapoo-tray-bundle-windows
          path: |
            bin/rapoo-tray.exe
            dist/rapoo-tray-setup.exe
            bin/rapoo-plugin.dll
          if-no-files-found: error
          retention-days: 14
