name: Build Check

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build WPF Fluent settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore settings-ui/RapooTray.Settings.csproj --configfile NuGet.config
          dotnet build settings-ui/RapooTray.Settings.csproj -c Release --no-restore
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $settingsExe = Get-ChildItem 'settings-ui/bin' -Recurse -File -Filter 'rapoo-tray-settings.exe' | Where-Object { $_.DirectoryName -match '\\Release\\net48$' } | Select-Object -First 1
          if (!$settingsExe) { throw 'WPF settings output directory was not found' }
          Get-ChildItem $settingsExe.DirectoryName -File | Where-Object { $_.Extension -ne '.pdb' } | Copy-Item -Destination bin -Force

      - name: Build native tray application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          if (!(Test-Path 'bin/rapoo-tray.exe')) { throw 'rapoo-tray.exe was not produced' }
          if (!(Test-Path 'bin/rapoo-tray-settings.exe')) { throw 'rapoo-tray-settings.exe was not staged' }
          if (!(Test-Path 'bin/Wpf.Ui.dll')) { throw 'Wpf.Ui.dll was not staged' }

      - name: Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

      - name: Build WPF-embedded installer
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cd installer
          windres --codepage 65001 -i installer.rc -o installer.o -O coff
          g++ -O3 -std=c++17 -mwindows -municode -s -static installer.cpp installer.o -lole32 -lshell32 -luser32 -lgdi32 -ladvapi32 -luuid -o ../dist/rapoo-tray-setup.exe
          rm -f installer.o

      - name: Build rapoo-plugin.dll
        shell: msys2 {0}
        run: |
          mkdir -p bin
          cd plugin
          windres --codepage 65001 -i plugin.rc -o plugin.o -O coff
          g++ -shared -O3 -std=c++17 -mwindows -municode -s -static rapoo_plugin.cpp plugin.o -lsetupapi -lhid -luser32 -lgdi32 -lshell32 -ladvapi32 -o ../bin/rapoo-plugin.dll
          rm -f plugin.o

      - name: Create portable bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $files = @(
            'bin/rapoo-tray.exe',
            'bin/rapoo-tray-settings.exe',
            'bin/rapoo-tray-settings.exe.config',
            'bin/Wpf.Ui.dll',
            'bin/Wpf.Ui.Abstractions.dll',
            'bin/System.Memory.dll',
            'bin/System.Buffers.dll',
            'bin/System.Numerics.Vectors.dll',
            'bin/System.Runtime.CompilerServices.Unsafe.dll',
            'licenses/wpf-ui-LICENSE.md',
            'licenses/wpf-ui-THIRDPARTY.txt',
            'licenses/saira-OFL.txt'
          )
          Compress-Archive -Path $files -DestinationPath 'dist/rapoo-tray-portable.zip' -Force

      - name: Upload build bundle
        uses: actions/upload-artifact@v4
        with:
          name: rapoo-tray-bundle-windows
          path: |
            bin/rapoo-tray.exe
            bin/rapoo-tray-settings.exe
            bin/rapoo-tray-settings.exe.config
            bin/Wpf.Ui.dll
            bin/Wpf.Ui.Abstractions.dll
            bin/System.Memory.dll
            bin/System.Buffers.dll
            bin/System.Numerics.Vectors.dll
            bin/System.Runtime.CompilerServices.Unsafe.dll
            dist/rapoo-tray-portable.zip
            dist/rapoo-tray-setup.exe
            bin/rapoo-plugin.dll
            licenses/wpf-ui-LICENSE.md
            licenses/wpf-ui-THIRDPARTY.txt
            licenses/saira-OFL.txt
          if-no-files-found: error
          retention-days: 14
