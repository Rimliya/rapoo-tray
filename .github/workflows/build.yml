name: Build Check

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

      - name: Build rapoo-tray.exe
        shell: msys2 {0}
        run: |
          mkdir -p bin
          windres --codepage 65001 -I res -i res/app.rc -o bin/app.o
          g++ -O3 -std=c++17 -mwindows -municode -s -static \
            src/main.cpp \
            src/rapoo_protocol.cpp \
            src/device_manager.cpp \
            src/osd_window.cpp \
            src/tray_menu.cpp \
            src/alert_window.cpp \
            src/profile_manager.cpp \
            src/settings_window.cpp \
            bin/app.o \
            -lsetupapi -lhid -luser32 -lgdi32 -lshell32 -ladvapi32 \
            -luxtheme -ldwmapi -lcomdlg32 -lcomctl32 \
            -o bin/rapoo-tray.exe
          rm -f bin/app.o

      - name: Build rapoo-tray-setup.exe
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cd installer
          windres --codepage 65001 -i installer.rc -o installer.o -O coff
          g++ -O3 -std=c++17 -mwindows -municode -s -static installer.cpp installer.o -lole32 -lshell32 -luser32 -lgdi32 -ladvapi32 -luuid -o ../dist/rapoo-tray-setup.exe
          rm -f installer.o

      - name: Build rapoo-plugin.dll
        shell: msys2 {0}
        run: |
          mkdir -p bin
          cd plugin
          windres --codepage 65001 -i plugin.rc -o plugin.o -O coff
          g++ -shared -O3 -std=c++17 -mwindows -municode -s -static rapoo_plugin.cpp plugin.o -lsetupapi -lhid -luser32 -lgdi32 -lshell32 -ladvapi32 -o ../bin/rapoo-plugin.dll
          rm -f plugin.o

      - name: Upload build bundle
        uses: actions/upload-artifact@v4
        with:
          name: rapoo-tray-bundle-windows
          path: |
            bin/rapoo-tray.exe
            dist/rapoo-tray-setup.exe
            bin/rapoo-plugin.dll
          if-no-files-found: error
          retention-days: 14