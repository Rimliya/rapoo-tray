name: HID Probe

on:
  push:
    branches:
      - codex/hid-probe-v160
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils
      - name: Build read-only HID probe
        shell: msys2 {0}
        run: |
          mkdir -p bin
          g++ -O2 -std=c++17 -municode -mconsole -static -Isrc \
            tools/hid_probe.cpp src/device_manager.cpp src/rapoo_protocol.cpp \
            -lsetupapi -lhid -luser32 -ladvapi32 -o bin/hid-probe.exe
      - uses: actions/upload-artifact@v4
        with:
          name: hid-probe
          path: bin/hid-probe.exe
          if-no-files-found: error
          retention-days: 3