name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Binaries
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Slint C++ SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $PWD 'slint-cpp-installer.exe'
          $sdk = Join-Path $PWD 'slint-sdk'
          Invoke-WebRequest -Uri 'https://github.com/slint-ui/slint/releases/download/v1.18.1/Slint-cpp-1.18.1-win64-MSVC-AMD64.exe' -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$sdk" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Slint SDK installer failed with exit code $($process.ExitCode)" }
          "SLINT_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Slint Fluent application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:SLINT_SDK" -DSLINT_STYLE=fluent
          cmake --build build --config Release
          if (!(Test-Path 'bin/rapoo-tray.exe')) { throw 'rapoo-tray.exe was not produced' }
          if (!(Test-Path 'bin/slint_cpp.dll')) { throw 'slint_cpp.dll was not copied' }

      - name: Setup MinGW Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

      - name: Build Slint-embedded installer
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cd installer
          windres --codepage 65001 -i installer.rc -o installer.o -O coff
          g++ -O3 -std=c++17 -mwindows -municode -s -static installer.cpp installer.o -lole32 -lshell32 -luser32 -lgdi32 -ladvapi32 -luuid -o ../dist/rapoo-tray-setup.exe
          rm -f installer.o

      - name: Build rapoo-plugin.dll
        shell: msys2 {0}
        run: |
          mkdir -p bin
          cd plugin
          windres --codepage 65001 -i plugin.rc -o plugin.o -O coff
          g++ -shared -O3 -std=c++17 -mwindows -municode -s -static rapoo_plugin.cpp plugin.o -lsetupapi -lhid -luser32 -lgdi32 -lshell32 -ladvapi32 -o ../bin/rapoo-plugin.dll
          rm -f plugin.o

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^##\s+\[?$([regex]::Escape($tag))\]?[^\r\n]*\r?\n.*?(?=^##\s+|\z)"
          $entry = [regex]::Match($text, $pattern)
          if (-not $entry.Success) { throw "No changelog entry for $tag" }
          $entry.Value.Trim() | Set-Content release-body.md -Encoding utf8

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: release-body.md
          files: |
            bin/rapoo-tray.exe
            bin/slint_cpp.dll
            dist/rapoo-tray-setup.exe
            bin/rapoo-plugin.dll
